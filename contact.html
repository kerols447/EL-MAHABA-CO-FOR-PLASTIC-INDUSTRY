<body data-page="contact"
      data-title-ar="اتصل بنا | المحبة بلاست — اطلب عرض سعرك"
      data-title-en="Contact | Al Mahaba — Request Your Quote"
      class="font-cairo bg-cream">

  <div id="site-header-mount"></div>

  <main id="main-content">

    <!-- PAGE HERO — cream band with breadcrumb (reference style) -->
    <section class="bg-creamdeep border-b border-primary-100">
      <div class="max-w-content mx-auto px-4 sm:px-6 py-10 lg:py-14">
        <nav class="crumb mb-5" aria-label="مسار التنقل" data-i18n-aria="a11y.crumb">
          <a href="index.html" data-i18n="nav.home"></a><span class="sep">/</span>
          <span aria-current="page" data-i18n="nav.contact"></span>
        </nav>
        <span class="eyebrow" data-i18n="contact.hero.kicker"></span>
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-primary-700 mb-4 leading-snug" data-i18n="contact.hero.title"></h1>
        <p class="text-muted max-w-2xl leading-relaxed" data-i18n="contact.hero.subtitle"></p>
      </div>
    </section>

    <!-- ============================================================
         QUOTE FORM + CONTACT CARDS
         Submissions go to Formspree → Nourhamam2014@yahoo.com
         ============================================================ -->
    <section id="quote-form" class="section-pad bg-cream">
      <div class="max-w-content mx-auto px-4 sm:px-6 grid lg:grid-cols-5 gap-10 items-start">

        <!-- Form column -->
        <div class="lg:col-span-3 card p-7 sm:p-9 reveal">
          <h2 class="text-2xl font-bold text-primary-700 mb-2" data-i18n="contact.quote.title"></h2>
          <p class="text-muted text-sm leading-relaxed mb-7" data-i18n="contact.quote.subtitle"></p>

          <form data-mp-form novalidate>
            <div class="form-alert mb-6" data-form-alert></div>

            <!-- honeypot anti-spam -->
            <div class="hp-field" aria-hidden="true">
              <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
            </div>

            <input type="hidden" name="request_type" value="quote">

            <div class="grid sm:grid-cols-2 gap-5">
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-name"><span data-i18n="form.name"></span> <span class="text-red-500">*</span></label>
                <input id="qf-name" name="name" class="field" required data-i18n-placeholder="form.name">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-company"><span data-i18n="form.company"></span> <span class="text-red-500">*</span></label>
                <input id="qf-company" name="company" class="field" required data-i18n-placeholder="form.company">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-phone"><span data-i18n="form.phone"></span> <span class="text-red-500">*</span></label>
                <input id="qf-phone" name="phone" class="field" required data-rule="phone" dir="ltr" inputmode="tel" placeholder="+20 1xx xxx xxxx">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-email"><span data-i18n="form.email"></span> <span class="text-red-500">*</span></label>
                <input id="qf-email" name="email" type="email" class="field" required data-rule="email" dir="ltr" inputmode="email" placeholder="name@company.com">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-type"><span data-i18n="form.productType"></span> <span class="text-red-500">*</span></label>
                <select id="qf-type" name="product_type" class="field" required>
                  <option value="" data-i18n="form.productType.choose"></option>
                  <option value="masterbatch" data-i18n="products.masterbatch"></option>
                  <option value="pet-colors" data-i18n="products.pet"></option>
                  <option value="raw-materials" data-i18n="products.raw"></option>
                </select>
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-color"><span data-i18n="form.color"></span></label>
                <input id="qf-color" name="color_code" class="field" data-i18n-placeholder="form.color">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-material"><span data-i18n="form.material"></span></label>
                <input id="qf-material" name="material" class="field" data-i18n-placeholder="form.material">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="qf-qty"><span data-i18n="form.quantity"></span></label>
                <input id="qf-qty" name="monthly_quantity" class="field" data-i18n-placeholder="form.quantity">
              </div>
              <div class="sm:col-span-2">
                <label class="block font-bold mb-1.5 text-navy" for="qf-delivery"><span data-i18n="form.delivery"></span></label>
                <input id="qf-delivery" name="delivery_location" class="field" data-i18n-placeholder="form.delivery">
              </div>
            </div>

            <div class="mt-5">
              <label class="block font-bold mb-1.5 text-navy" for="qf-notes"><span data-i18n="form.notes"></span></label>
              <textarea id="qf-notes" name="notes" rows="4" class="field" data-i18n-placeholder="form.notes"></textarea>
            </div>

            <button type="submit" class="btn btn-accent w-full sm:w-auto mt-7">
              <span data-btn-label data-i18n="cta.send"></span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </form>
        </div>

        <!-- Contact cards column -->
        <div class="lg:col-span-2 space-y-5 reveal" data-reveal-delay="120">
          <h2 class="text-2xl font-bold text-primary-700" data-i18n="contact.info.title"></h2>

          <!-- Tel -->
          <a href="tel:+20554413455" class="card card-hover p-5 flex items-center gap-4 block">
            <span class="w-12 h-12 rounded-2xl bg-primary-50 text-primary flex items-center justify-center shrink-0"><i data-lucide="phone" class="w-5 h-5"></i></span>
            <span>
              <span class="block text-xs font-bold text-muted" data-i18n="contact.phone1Label"></span>
              <span class="block font-extrabold text-navy ltr-inline" dir="ltr">+20 55 441 3455</span>
            </span>
          </a>

          <!-- Fax -->
          <div class="card p-5 flex items-center gap-4">
            <span class="w-12 h-12 rounded-2xl bg-primary-50 text-primary flex items-center justify-center shrink-0"><i data-lucide="printer" class="w-5 h-5"></i></span>
            <span>
              <span class="block text-xs font-bold text-muted" data-i18n="contact.phone2Label"></span>
              <span class="block font-extrabold text-navy ltr-inline" dir="ltr">+20 55 441 3455</span>
            </span>
          </div>

          <!-- WhatsApp -->
          <a data-wa-link href="#" target="_blank" rel="noopener" class="card card-hover p-5 flex items-center gap-4 block">
            <span class="w-12 h-12 rounded-2xl bg-green-500 text-white flex items-center justify-center shrink-0"><i data-lucide="message-circle" class="w-5 h-5"></i></span>
            <span>
              <span class="block text-xs font-bold text-muted" data-i18n="contact.whatsappLabel"></span>
              <span class="block font-extrabold text-navy ltr-inline" dir="ltr">+20 127 488 9660</span>
            </span>
          </a>

          <!-- Email -->
          <a href="mailto:Nourhamam2014@yahoo.com" class="card card-hover p-5 flex items-center gap-4 block">
            <span class="w-12 h-12 rounded-2xl bg-accent-50 text-accent flex items-center justify-center shrink-0"><i data-lucide="mail" class="w-5 h-5"></i></span>
            <span class="min-w-0">
              <span class="block text-xs font-bold text-muted" data-i18n="contact.emailLabel"></span>
              <span class="block font-extrabold text-navy ltr-inline break-all" dir="ltr">Nourhamam2014@yahoo.com</span>
            </span>
          </a>

          <!-- Address -->
          <div class="card p-5 flex items-start gap-4">
            <span class="w-12 h-12 rounded-2xl bg-primary-50 text-primary flex items-center justify-center shrink-0"><i data-lucide="map-pin" class="w-5 h-5"></i></span>
            <span>
              <span class="block font-extrabold text-navy" data-i18n="contact.address"></span>
            </span>
          </div>

          <!-- Markets note -->
          <div class="card p-5 flex items-start gap-4 bg-primary text-white border-primary">
            <span class="w-12 h-12 rounded-2xl bg-white/15 text-white flex items-center justify-center shrink-0"><i data-lucide="globe" class="w-5 h-5"></i></span>
            <p class="text-sm font-bold leading-relaxed" data-i18n="contact.hours"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================================
         GOOGLE MAPS — city-level embed until exact address confirmed
         [PLACEHOLDER] Replace src with a pinned embed of the exact
         factory address once street/zone is confirmed.
         ============================================================ -->
    <section class="bg-creamdeep border-y border-primary-100">
      <div class="max-w-content mx-auto px-4 sm:px-6 py-14">
        <div class="text-center mb-8 reveal">
          <h2 class="sec-title font-bold text-primary-700 mb-2" data-i18n="contact.map.title"></h2>
          <p class="text-sm text-muted" data-i18n="contact.map.note"></p>
        </div>
        <div class="relative h-[420px] rounded-2xl overflow-hidden shadow-card border border-primary-100 reveal" data-reveal-delay="100">
          <!-- Fallback location card: shows through if the maps embed cannot load -->
          <div class="absolute inset-0 bg-sagelight dot-grid flex flex-col items-center justify-center gap-4 text-center px-6">
            <span class="w-14 h-14 rounded-full bg-primary text-white flex items-center justify-center"><i data-lucide="map-pin" class="w-6 h-6"></i></span>
            <p class="font-extrabold text-primary-700 text-lg" data-i18n="contact.address"></p>
            <p class="text-sm text-muted max-w-md" data-i18n="contact.map.note"></p>
            <a href="https://www.google.com/maps/search/?api=1&query=10th%20of%20Ramadan%20City%2C%20Industrial%20Zone%20A1%2C%20Egypt" target="_blank" rel="noopener" class="btn btn-primary btn-sm">
              <i data-lucide="external-link" class="w-4 h-4"></i>
              <span data-i18n="contact.map.open"></span>
            </a>
          </div>
          <iframe
            src="https://www.google.com/maps?q=10th%20of%20Ramadan%20City%2C%20Industrial%20Zone%20A1%2C%20Egypt&z=13&output=embed"
            title="خريطة موقع المحبة بلاست — العاشر من رمضان، المنطقة الصناعية A1"
            class="relative z-10 w-full h-full" style="border:0" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- CALL BAND — sage (reference style) -->
    <section class="bg-sage">
      <div class="max-w-content mx-auto px-4 sm:px-6 py-14 text-center">
        <h2 class="sec-title font-bold text-primary-700 mb-3" data-i18n="contact.call.title"></h2>
        <p class="text-ink/80 mb-7" data-i18n="contact.call.subtitle"></p>
        <div class="flex flex-wrap gap-4 justify-center">
          <a href="tel:+20554413455" class="btn btn-primary">
            <i data-lucide="phone" class="w-4 h-4"></i>
            <span dir="ltr">+20 55 441 3455</span>
          </a>
          <a data-wa-link href="#" target="_blank" rel="noopener" class="btn btn-whatsapp">
            <i data-lucide="message-circle" class="w-4 h-4"></i>
            <span data-i18n="cta.whatsapp"></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer-mount"></div>
  <div id="floating-mount"></div>
