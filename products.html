  <script>

        var l = localStorage.getItem('mp-lang') === 'ar' ? 'ar' : 'en';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>

<body data-page="products"
      data-title-ar="منتجاتنا | المحبة بلاست — ماستر باتش وألوان PET وخامات بلاستيك"
      data-title-en="Our Products | Al Mahaba — Masterbatch, PET Colors & Raw Materials"
      class="font-cairo bg-cream">

  <div id="site-header-mount"></div>

  <main id="main-content">

    <!-- PAGE HERO — cream band with breadcrumb (reference style) -->
    <section class="bg-creamdeep border-b border-primary-100">
      <div class="max-w-content mx-auto px-4 sm:px-6 py-10 lg:py-14">
        <nav class="crumb mb-5" aria-label="مسار التنقل" data-i18n-aria="a11y.crumb">
          <a href="index.html" data-i18n="nav.home"></a><span class="sep">/</span>
          <span aria-current="page" data-i18n="nav.products"></span>
        </nav>
        <span class="eyebrow" data-i18n="products.hero.kicker"></span>
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-primary-700 mb-4 leading-snug" data-i18n="products.hero.title"></h1>
        <p class="text-muted max-w-2xl leading-relaxed" data-i18n="products.hero.subtitle"></p>
      </div>
    </section>

    <!-- ============================================================
         TABS + PRODUCT GRID
         Cards are generated from the PRODUCTS array in main.js —
         edit that array to add/remove products. Each card links to
         product.html?p=<index> (reference-style detail page).
         ============================================================ -->
    <section class="section-pad bg-cream">
      <div class="max-w-content mx-auto px-4 sm:px-6">
        <div id="product-tabs" class="flex flex-wrap justify-center gap-3 mb-12" role="group" aria-label="تصنيفات المنتجات"></div>
        <div id="product-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-7"></div>
      </div>
    </section>

    <!-- CTA BAND — sage centered (reference style) -->
    <section class="bg-sage py-16 lg:py-20">
      <div class="max-w-content mx-auto px-4 sm:px-6 text-center reveal">
        <h2 class="text-3xl font-bold text-primary-700 mb-4" data-i18n="home.cta.title"></h2>
        <p class="text-ink/80 max-w-xl mx-auto mb-9 leading-relaxed" data-i18n="home.cta.subtitle"></p>
        <div class="flex flex-wrap gap-4 justify-center">
          <a href="contact.html#quote-form" class="btn btn-accent"><span data-i18n="cta.quote"></span><i data-lucide="arrow-right" class="w-4 h-4"></i></a>
          <a data-wa-link href="#" target="_blank" rel="noopener" class="btn btn-whatsapp"><i data-lucide="message-circle" class="w-5 h-5"></i><span data-i18n="cta.whatsapp"></span></a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer-mount"></div>
  <div id="floating-mount"></div>

  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/main.js"></script>
